name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'MLD API Base URL'
        required: false
        default: 'https://mld-api.salman61902.workers.dev/api/v1'
      admob_app_id:
        description: 'AdMob App ID (leave empty for default test ID)'
        required: false
        default: ''
      admob_rewarded_unit:
        description: 'AdMob Rewarded Unit ID (leave empty for default test ID)'
        required: false
        default: ''
      google_client_id:
        description: 'Google OAuth Web Client ID'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-release.yml'

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Keystore (from Secrets or Debug fallback)
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "Configuring Release Keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/mld-release.keystore
            cat <<EOF > android/key.properties
          storeFile=mld-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS || 'mldrelease' }}
          keyPassword=${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          EOF
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore secrets detected; building with fallback debug signing."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Prepare Build Flags
        id: flags
        run: |
          FLAGS=""
          
          # API Base URL
          API_URL="${{ github.event.inputs.api_base_url || secrets.MLD_API_BASE || 'https://mld-api.salman61902.workers.dev/api/v1' }}"
          FLAGS="$FLAGS --dart-define=MLD_API_BASE=$API_URL"
          
          # Google Client ID
          CLIENT_ID="${{ github.event.inputs.google_client_id || secrets.MLD_GOOGLE_SERVER_CLIENT_ID }}"
          if [ -n "$CLIENT_ID" ]; then
            FLAGS="$FLAGS --dart-define=MLD_GOOGLE_SERVER_CLIENT_ID=$CLIENT_ID"
          fi
          
          # AdMob Rewarded Unit
          REWARD_UNIT="${{ github.event.inputs.admob_rewarded_unit || secrets.MLD_REWARDED_UNIT }}"
          if [ -n "$REWARD_UNIT" ]; then
            FLAGS="$FLAGS --dart-define=MLD_REWARDED_UNIT=$REWARD_UNIT"
          fi
          
          # Gradle AdMob App ID
          ADMOB_APP="${{ github.event.inputs.admob_app_id || secrets.MLD_ADMOB_APP_ID }}"
          GRADLE_FLAGS=""
          if [ -n "$ADMOB_APP" ]; then
            GRADLE_FLAGS="-PMLD_ADMOB_APP_ID=$ADMOB_APP"
          fi
          
          echo "build_flags=$FLAGS" >> $GITHUB_OUTPUT
          echo "gradle_flags=$GRADLE_FLAGS" >> $GITHUB_OUTPUT

      - name: Build Release APK (arm64)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            ${{ steps.flags.outputs.gradle_flags }} \
            ${{ steps.flags.outputs.build_flags }}

      - name: Build Release App Bundle (AAB for Play Store)
        run: |
          flutter build appbundle --release \
            ${{ steps.flags.outputs.gradle_flags }} \
            ${{ steps.flags.outputs.build_flags }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxLevel-Detox-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxLevel-Detox-Release-AAB
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false
