# v2.5.6 audit-fix build note: sandbox/container has a 4 GiB RAM limit and
# no swap — the default -Xmx2048m -XX:MaxMetaspaceSize=768m let the daemon
# (kapt in-process + R8 in-daemon) reach ~2.8 GB RSS and get OOM-killed
# mid-compile. Clamped to fit the box while still covering Kotlin compile +
# Room kapt + R8 in a single in-process JVM.
# v2.7.1 (r14): clamped further (1152m/384m) after the OOM killer took a
# 2.38 GB-RSS daemon on a cold-cache build; covers Kotlin compile + Room
# kapt + R8 for this app's ~24 MB APK with ~1 GB of headroom to spare.
# v2.9 (r16): 384m metaspace OOM'd on a FULLY-COLD build box (every plugin
# module compiles in-process from scratch — compiler classes accumulate in
# metaspace). Rebalanced: heap 1152m -> 1024m, metaspace 384m -> 512m,
# code cache capped at 160m. Same total footprint, survives cold builds.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=160m -XX:+UseSerialGC
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# v2.5.7 (L-5): jetifier disabled — every dependency in this project is
# already AndroidX-native (verified: no support-library artifacts remain in
# the resolved set). The flag only slowed every build by running the
# unnecessary jetifier transform pass. If a future dependency needs it,
# re-enable per-module instead of globally.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
